name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: create release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

      # The changelog says what changed. It cannot say why the tool refuses to
      # delete, and that is the first question a release page has to answer.
      # Keep the answer in one file and prepend it, so the two never drift.
      - name: Prepend the "why no delete" header
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(gh release view "$TAG" --json body --jq .body)
          if [[ "$notes" == *"moltdisk:release-header"* ]]; then
            echo "header already present, leaving the body alone"
            exit 0
          fi
          {
            cat .github/release-header.md
            printf '%s\n' "$notes"
          } > "$RUNNER_TEMP/release-body.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-body.md"
          echo "release body is $(wc -c < "$RUNNER_TEMP/release-body.md") bytes"

  binaries:
    name: build ${{ matrix.target }}
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and attach
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: moltdisk
          target: ${{ matrix.target }}
          archive: moltdisk-$tag-$target
          include: README.md,LICENSE
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
